name: evidence integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and research dependencies
        run: python -m pip install -e ".[app,research]"
      - name: Run known-answer regression gates
        run: python scripts/regress.py
      - name: Verify repository evidence chain
        run: python scripts/audit_integrity.py
      - name: Verify public-data publication approvals
        run: python scripts/audit_publication.py --strict
      - name: Execute the API-free canonical demo
        run: |
          python - <<'PY'
          from verdict import canonical_demo

          run = canonical_demo.run()
          assert run["verdict"]["state"] == "bounded-verdict-delivered"
          context = canonical_demo.load_context()
          assert all(item["verified"] for item in context["evidence"]["artifacts"])
          print(run["verdict"]["outcome"])
          PY
