name: verdict
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - statsmodels
  - scikit-learn
  - matplotlib
  - pyarrow
  - pyyaml
  - pytest
  - openpyxl       # reads the Goyal-Welch predictor workbook
  - requests
  - ipykernel
  - streamlit      # the working surface (app.py)
  - pypdf          # optional PDF → text boundary for the paper-audit UI
  - pip
# Recreate: micromamba env create -f environment.yml
