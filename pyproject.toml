[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "verdict"
version = "0.1.0"
description = "A validation harness for time-series prediction claims"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "statsmodels",
]

[project.optional-dependencies]
app = ["streamlit", "pypdf"]
agent = ["anthropic"]
research = ["matplotlib", "pyarrow", "pyyaml"]

[tool.setuptools.packages.find]
include = ["verdict*"]
